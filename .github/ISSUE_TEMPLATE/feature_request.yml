name: Feature request
description: Suggest an improvement to the sample
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user need or limitation should this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the behavior and how it could be evaluated.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Retrieval
        - Generation and prompting
        - Arabic language support
        - Evaluation
        - API and developer experience
        - Documentation
    validations:
      required: true
